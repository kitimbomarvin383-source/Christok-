name: Build ChrisTok APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: cp lib/main.dart /tmp/main.dart.bak
      - run: flutter create --project-name christok --org com.christok.app .
      - run: cp /tmp/main.dart.bak lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: christok-apk
          path: build/app/outputs/flutter-apk/app-release.apk
